<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | FoodBridge</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><header class="navbar"><a class="brand" href="index.html"><span class="brand-icon">FB</span>FoodBridge</a><a href="index.html">← Home</a></header><main class="auth-wrap"><section class="auth-card"><div class="auth-mark">🌱</div><span class="eyebrow">WELCOME TO FOODBRIDGE</span><h1 id="formTitle">Welcome back</h1><p id="formDescription">Sign in to continue.</p><div id="authMessage" class="message hidden" role="status"></div>
<form id="loginForm"><label>Email address<input id="loginEmail" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<input id="loginPassword" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters"></label><button class="btn btn-primary full-width" type="submit">Sign in</button></form>
<form id="signupForm" class="hidden"><label>Full name<input id="signupName" type="text" required maxlength="100" placeholder="Your full name"></label><label>Email address<input id="signupEmail" type="email" required placeholder="you@example.com"></label><label>Password<input id="signupPassword" type="password" required minlength="6" placeholder="At least 6 characters"></label><label>Join as<select id="signupRole"><option value="donor">Food donor</option><option value="trust">Community organization / trust</option></select></label><label>Organization name (for trusts)<input id="signupOrg" maxlength="120" placeholder="Trust / NGO name (optional for donors)"></label><div class="span-2"><button class="btn btn-outline full-width" type="button" id="signupLocation">📍 Use my current location</button><small id="signupLocationStatus" class="fine-print">Location is used to find nearby food matches. You can skip it, but automatic distance matching will not work.</small></div><button class="btn btn-primary full-width" type="submit">Create account</button></form>
<p class="auth-switch"><span id="switchText">New to FoodBridge?</span> <button type="button" class="text-button" id="switchMode">Create an account</button></p><p class="fine-print">Prototype accounts are not proof of verified organization status.</p></section></main><script type="module" src="js/auth.js"></script></body></html>
