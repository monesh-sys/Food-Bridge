<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sign In | FoodBridge</title>

    <!-- FoodBridge Favicon -->
    <link rel="icon" type="image/png" href="images/foodbridge-logo.png">
    <link rel="apple-touch-icon" href="images/foodbridge-logo.png">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        .brand {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }

        .brand-logo {
            width: 45px;
            height: 45px;
            object-fit: contain;
            border-radius: 8px;
        }

        .auth-mark {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .auth-logo {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 15px;
        }

        .forgot-password {
            display: flex;
            justify-content: flex-end;
            margin-top: -8px;
            margin-bottom: 20px;
        }

        .forgot-password button {
            border: none;
            background: transparent;
            color: #087451;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            padding: 5px 0;
        }

        .forgot-password button:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body class="auth-page">

    <!-- HEADER -->
    <header class="navbar">
        <a class="brand" href="index.html">
            <img
                src="images/foodbridge-logo.png"
                alt="FoodBridge Logo"
                class="brand-logo"
            >
            <span>FoodBridge</span>
        </a>

        <a href="index.html">← Home</a>
    </header>

    <!-- AUTHENTICATION SECTION -->
    <main class="auth-wrap">
        <section class="auth-card">

            <!-- FOODBRIDGE LOGO -->
            <div class="auth-mark">
                <img
                    src="images/foodbridge-logo.png"
                    alt="FoodBridge Logo"
                    class="auth-logo"
                >
            </div>

            <span class="eyebrow">WELCOME TO FOODBRIDGE</span>

            <h1 id="formTitle">Welcome back</h1>

            <p id="formDescription">
                Sign in to continue.
            </p>

            <!-- AUTH MESSAGE -->
            <div
                id="authMessage"
                class="message hidden"
                role="status"
                aria-live="polite"
            ></div>

            <!-- LOGIN FORM -->
            <form id="loginForm">

                <label>
                    Email address

                    <input
                        id="loginEmail"
                        type="email"
                        autocomplete="email"
                        required
                        placeholder="you@example.com"
                    >
                </label>

                <label>
    Password

    <div class="password-wrapper">
        <input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            required
            minlength="6"
            placeholder="At least 6 characters"
        >

        <button
            type="button"
            class="password-toggle"
            data-target="loginPassword"
            aria-label="Show password"
        >👁</button>
    </div>
</label>
                <!-- FORGOT PASSWORD -->
                <div class="forgot-password">
                    <button
                        type="button"
                        id="forgotPasswordButton"
                    >
                        Forgot password?
                    </button>
                </div>

                <button class="btn btn-primary full-width" type="submit">
                    Sign in
                </button>

            </form>

            <!-- SIGNUP FORM -->
            <form id="signupForm" class="hidden">

                <label>
                    Full name

                    <input
                        id="signupName"
                        type="text"
                        required
                        maxlength="100"
                        placeholder="Your full name"
                    >
                </label>

                <label>
                    Email address

                    <input
                        id="signupEmail"
                        type="email"
                        required
                        placeholder="you@example.com"
                    >
                </label>

                <label>
                    Password

                    <input
                        id="signupPassword"
                        type="password"
                        required
                        minlength="6"
                        placeholder="At least 6 characters"
                    >
                </label>

                <label>
                    Join as

                    <select id="signupRole">
                        <option value="donor">Food donor</option>
                        <option value="trust">Community organization / trust</option>
                    </select>
                </label>

                <label>
                    Organization name (for trusts)

                    <input
                        id="signupOrg"
                        maxlength="120"
                        placeholder="Trust / NGO name (optional for donors)"
                    >
                </label>

                <!-- LOCATION -->
                <div class="span-2">

                    <button
                        class="btn btn-outline full-width"
                        type="button"
                        id="signupLocation"
                    >
                        📍 Use my current location
                    </button>

                    <small
                        id="signupLocationStatus"
                        class="fine-print"
                    >
                        Location is used to find nearby food matches.
                        You can skip it, but automatic distance matching
                        will not work.
                    </small>

                </div>

                <button class="btn btn-primary full-width" type="submit">
                    Create account
                </button>

            </form>

            <!-- SWITCH LOGIN / SIGNUP -->
            <p class="auth-switch">

                <span id="switchText">
                    New to FoodBridge?
                </span>

                <button
                    type="button"
                    class="text-button"
                    id="switchMode"
                >
                    Create an account
                </button>

            </p>

            <p class="fine-print">
                Prototype accounts are not proof of verified organization status.
            </p>

        </section>
    </main>

    <!-- AUTH JAVASCRIPT -->
    <script type="module" src="./js/auth.js"></script>

</body>
</html>
